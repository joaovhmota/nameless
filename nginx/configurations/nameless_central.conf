server {
    listen 80;
    server_name central.nameless.app;
    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;

    server_name central.nameless.app;

    ssl_certificate /etc/nginx/certificates/nameless-central/central.nameless.app.pem;
    ssl_certificate_key /etc/nginx/certificates/nameless-central/central.nameless.app-key.pem;

    location / {
        proxy_pass http://nameless_central:3000;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        gzip on;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}