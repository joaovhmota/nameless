name: nameless

include:
  - project_directory: ./nameless-ai
    path: ./nameless-ai/compose.yml
  - project_directory: ./nameless-central
    path: ./nameless-central/compose.yml

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    depends_on:
      - ollama
      - nameless_central
    ports:
      - "80:80"
      - "443:443"
    expose:
      - "80"
      - "443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/configurations:/etc/nginx/configurations:ro
      - ./nginx/certificates:/etc/nginx/certificates:ro
    restart: unless-stopped
    networks:
      - nameless_network

networks:
  nameless_network:
    driver: bridge
